# Builds the website and the desktop programs and publishes a GitHub release.
#
# Start it either
#   - on GitHub: Actions > Release > "Run workflow", enter the version
#     (e.g. 3.1.0) and choose whether it is a draft, or
#   - by pushing a version tag, e.g. "git push origin v3.1.0".
#
# - Release text: release-notes/<tag>.md (e.g. release-notes/v3.1.0.md);
#   without that file GitHub writes a short list of changes.
# - A tag with a hyphen (e.g. v3.1.0-test) makes a DRAFT release: not public,
#   not archived by Zenodo, and can be deleted on GitHub (Releases page).
# - A normal tag (v3.1.0) makes a public release; Zenodo then archives it and
#   gives the version DOI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 3.1.0"
        required: true
      draft:
        description: "Draft only (not public, not archived by Zenodo)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            V="${V#v}"
            echo "TAG=v${V}" >> "$GITHUB_ENV"
            echo "DRAFT=${{ inputs.draft }}" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            case "${GITHUB_REF_NAME}" in *-*) echo "DRAFT=true" >> "$GITHUB_ENV" ;; *) echo "DRAFT=false" >> "$GITHUB_ENV" ;; esac
          fi

      - name: Check the version in CITATION.cff
        run: |
          V="${TAG#v}"; V="${V%%-*}"
          grep -q "^version: \"${V}\"" CITATION.cff || { echo "CITATION.cff does not say version ${V}"; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build website and desktop programs
        run: ./build.sh

      - name: Package desktop zips
        run: |
          VERSION="${TAG#v}"
          python3 tools/package_release.py "${VERSION}" release
          ls -l release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          ARGS=(--title "Chord Diagram Studio ${VERSION%%-*}" --target "${GITHUB_SHA}")
          if [ -f "release-notes/${TAG}.md" ]; then
            ARGS+=(--notes-file "release-notes/${TAG}.md")
          else
            ARGS+=(--generate-notes)
          fi
          if [ "${DRAFT}" = "true" ]; then
            ARGS+=(--draft)
          fi
          gh release create "${TAG}" release/*.zip "${ARGS[@]}"
